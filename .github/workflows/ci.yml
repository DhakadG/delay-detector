name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/engine.test.js

# Deployment is not done here. Cloudflare Workers Builds watches this repo and
# runs `wrangler deploy` itself on every push to main.
